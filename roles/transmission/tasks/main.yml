---
# roles/transmission/tasks/main.yml
# Installs transmission-daemon, matching the hand-built container.
# All state (settings.json, blocklists, resume files) lives on the host at
# /mnt/ssd2tb/configs/transmission, bind-mounted to /var/lib/transmission-daemon
# (mp1) — it persists across container rebuilds, so nothing is templated here.

# The bind-mounted state dir is owned 100102:100105 on the host (debian-transmission's
# uid/gid shifted by the unprivileged container's +100000 offset). Pin these ids
# before installing the package so its postinst doesn't claim a different uid/gid
# (which would happen on a fresh container, since uid 100/101 aren't taken by
# dhcpcd/postfix here like they were on the hand-built one).
- name: Pin debian-transmission group (gid 105, matches existing data ownership)
  group:
    name: debian-transmission
    gid: 105
    system: true

- name: Pin debian-transmission user (uid 102, matches existing data ownership)
  user:
    name: debian-transmission
    uid: 102
    group: debian-transmission
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    home: /var/lib/transmission-daemon

- name: Install transmission-daemon
  apt:
    name: transmission-daemon
    state: present
    update_cache: true

# Debian trixie packages transmission-daemon 4.1.0~beta2 (a March 2025
# pre-release snapshot from before 4.1.0 stable shipped) and, unlike a
# rolling repo, never updates it beyond security patches - it's frozen until
# the next Debian stable release. Upstream itself is actively developed
# (quarterly stable releases), so instead of running a stale beta we build
# current stable from source and point the systemd unit at that binary,
# keeping the apt package only for its base unit file/user/library deps.
- name: Install Transmission build dependencies
  apt:
    name:
      - build-essential
      - cmake
      - pkg-config
      - libcurl4-openssl-dev
      - libssl-dev
      - zlib1g-dev
      - libevent-dev
      - libpsl-dev
      - libb64-dev
      - libdeflate-dev
      - libminiupnpc-dev
      - libnatpmp-dev
      - libsystemd-dev
    state: present
    update_cache: true

- name: Get latest Transmission release
  uri:
    url: https://api.github.com/repos/transmission/transmission/releases/latest
    return_content: true
  register: transmission_release

- name: Set transmission version fact
  set_fact:
    transmission_version: "{{ transmission_release.json.tag_name }}"

- name: Check currently built transmission-daemon version
  command: /usr/local/bin/transmission-daemon --version
  register: transmission_built_version
  changed_when: false
  failed_when: false

- name: Build and install Transmission {{ transmission_version }} from source
  when: transmission_version not in (transmission_built_version.stdout | default(''))
  block:
    - name: Download Transmission {{ transmission_version }} source tarball
      get_url:
        url: "https://github.com/transmission/transmission/releases/download/{{ transmission_version }}/transmission-{{ transmission_version }}.tar.xz"
        dest: "/tmp/transmission-{{ transmission_version }}.tar.xz"
        mode: '0644'

    - name: Remove any stale extracted source tree
      file:
        path: "/usr/local/src/transmission-{{ transmission_version }}"
        state: absent

    - name: Extract Transmission source tarball
      unarchive:
        src: "/tmp/transmission-{{ transmission_version }}.tar.xz"
        dest: /usr/local/src
        remote_src: true

    # Release tarball ships pre-built web/public_html assets, so this doesn't
    # need Node/npm (REBUILD_WEB defaults off). GTK/Qt/CLI/tests/docs/lib are
    # all skipped - only the daemon and CLI utils (transmission-remote etc.)
    # are needed here.
    - name: Configure Transmission build
      command: >
        cmake -B build -S .
        -DCMAKE_BUILD_TYPE=Release
        -DCMAKE_INSTALL_PREFIX=/usr/local
        -DENABLE_DAEMON=ON
        -DENABLE_UTILS=ON
        -DENABLE_CLI=OFF
        -DENABLE_GTK=OFF
        -DENABLE_QT=OFF
        -DENABLE_MAC=OFF
        -DENABLE_TESTS=OFF
        -DINSTALL_WEB=ON
        -DINSTALL_DOC=OFF
        -DINSTALL_LIB=OFF
      args:
        chdir: "/usr/local/src/transmission-{{ transmission_version }}"

    - name: Build Transmission (several minutes)
      command: "cmake --build build -j{{ ansible_processor_vcpus | default(2) }}"
      args:
        chdir: "/usr/local/src/transmission-{{ transmission_version }}"

    - name: Install Transmission binaries
      command: cmake --install build
      args:
        chdir: "/usr/local/src/transmission-{{ transmission_version }}"
      notify: Restart transmission-daemon

    - name: Clean up source tree and tarball
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/usr/local/src/transmission-{{ transmission_version }}"
        - "/tmp/transmission-{{ transmission_version }}.tar.xz"

# cmake --install (WITH_SYSTEMD, auto-enabled by libsystemd-dev) drops its own
# unit at /usr/local/lib/systemd/system, which systemd loads *before*
# /lib/systemd/system - shadowing the apt package's unit instead of layering
# under our override.conf drop-in. That unit hardcodes User=transmission
# (which doesn't exist here; our user is debian-transmission), so the
# daemon fails to start with "Failed to determine user credentials". Remove
# it so systemd falls back to the apt package's unit (User=debian-transmission,
# Type=notify, hardening) with our drop-in applied on top.
- name: Remove cmake-installed systemd unit (shadows the apt package's unit)
  file:
    path: /usr/local/lib/systemd/system/transmission-daemon.service
    state: absent
  register: transmission_shadow_unit_removed

- name: Ensure systemd override directory exists
  file:
    path: /etc/systemd/system/transmission-daemon.service.d
    state: directory
    mode: '0755'

# Matches the hand-built container's drop-in: points at the bind-mounted
# config dir and allows RPC access from the LAN.
- name: Install systemd override for transmission-daemon
  copy:
    dest: /etc/systemd/system/transmission-daemon.service.d/override.conf
    content: |
      [Service]
      ExecStart=
      ExecStart=/usr/local/bin/transmission-daemon -f --config-dir /var/lib/transmission-daemon/info --allowed *.*.*.*
    mode: '0644'
  notify:
    - Reload systemd
    - Restart transmission-daemon

- name: Enable and start transmission-daemon
  systemd:
    name: transmission-daemon
    enabled: true
    state: started
    daemon_reload: true

# rpc-host-whitelist-enabled defaults to true with an empty whitelist, which
# rejects requests carrying a hostname Host header (e.g. via the Caddy
# reverse proxy at transmission.welpes.com) with HTTP 421 "Misdirected
# Request" — only numeric-IP Host headers are implicitly allowed. Add the
# proxied hostname to the whitelist. transmission-daemon rewrites
# settings.json from its in-memory config on shutdown, so it must be stopped
# before editing and started after, or the edit gets clobbered on next restart.
- name: Check if transmission.welpes.com is already in RPC host whitelist
  command: grep -q transmission.welpes.com /var/lib/transmission-daemon/info/settings.json
  register: transmission_host_whitelist
  changed_when: false
  failed_when: false

- name: Stop transmission-daemon to edit RPC host whitelist
  systemd:
    name: transmission-daemon
    state: stopped
  when: transmission_host_whitelist.rc != 0

- name: Add transmission.welpes.com to RPC host whitelist
  replace:
    path: /var/lib/transmission-daemon/info/settings.json
    regexp: '"rpc-host-whitelist": "[^"]*"'
    replace: '"rpc-host-whitelist": "transmission.welpes.com"'
  when: transmission_host_whitelist.rc != 0

- name: Start transmission-daemon
  systemd:
    name: transmission-daemon
    state: started
  when: transmission_host_whitelist.rc != 0

# download-dir was left pointing at the music subfolder from when this box
# only handled music torrents. Sonarr/Radarr/Lidarr each pass a *relative*
# category (tv-sonarr/radarr/lidarr, no absolute directory override), so
# Transmission creates those categories as children of download-dir - which
# put every Sonarr/Radarr download under torrents/music/{category}/ instead
# of as top-level siblings of music, and left the real torrents/movies
# category permanently empty. Only affects newly-added torrents going
# forward; existing ones keep whatever downloadDir they were already given.
- name: Check if download-dir already points at the torrents root
  command: "grep -q '\"download-dir\": \"/data/torrents\"' /var/lib/transmission-daemon/info/settings.json"
  register: transmission_download_dir
  changed_when: false
  failed_when: false

- name: Stop transmission-daemon to fix download-dir
  systemd:
    name: transmission-daemon
    state: stopped
  when: transmission_download_dir.rc != 0

- name: Point download-dir at the torrents root, not the music subfolder
  replace:
    path: /var/lib/transmission-daemon/info/settings.json
    regexp: '"download-dir": "[^"]*"'
    replace: '"download-dir": "/data/torrents"'
  when: transmission_download_dir.rc != 0

- name: Start transmission-daemon (download-dir fix)
  systemd:
    name: transmission-daemon
    state: started
  when: transmission_download_dir.rc != 0

# Transmission only creates a category subdirectory the first time a torrent
# is added under it, and removes nothing itself - but an empty category dir
# can still disappear from manual cleanup (e.g. the 2026-06-15 disk cleanup).
# Sonarr/Lidarr each run a RemotePathMappingCheck health check that errors
# out if their category dir isn't present, even though Transmission would
# happily recreate it on the next grab. Pre-create all of them so the arr
# apps' health checks stay clean regardless of recent download activity.
- name: Ensure arr download category directories exist
  file:
    path: "/data/torrents/{{ item }}"
    state: directory
    owner: debian-transmission
    group: debian-transmission
    mode: '0755'
  loop:
    - lidarr
    - radarr
    - tv-sonarr

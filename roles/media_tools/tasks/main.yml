---
# roles/media_tools/tasks/main.yml
# Media maintenance tooling on the Proxmox host (runs against /mnt/ssd2tb
# directly — no LXC needed). Currently: BDMV concert -> chaptered MKV remux,
# a manual on-demand equivalent for DVD-Video concert rips, a follow-up
# HEVC compression pass for WiFi-friendly streaming, and a daily pass
# normalizing the movies/series libraries to 1080p HEVC + stereo AAC.

- name: Install mkvtoolnix, ffmpeg, Intel VAAPI driver (for QuickSync) and python3-mutagen
  apt:
    name: [mkvtoolnix, ffmpeg, intel-media-va-driver, vainfo, python3-mutagen]
    state: present

- name: Deploy remux_concerts.sh
  copy:
    src: remux_concerts.sh
    dest: /usr/local/bin/remux_concerts.sh
    mode: '0755'

- name: Deploy remux-concerts systemd service
  copy:
    src: remux-concerts.service
    dest: /etc/systemd/system/remux-concerts.service

- name: Deploy remux-concerts systemd timer
  copy:
    src: remux-concerts.timer
    dest: /etc/systemd/system/remux-concerts.timer

- name: Enable and start remux-concerts timer
  systemd:
    name: remux-concerts.timer
    enabled: true
    state: started
    daemon_reload: true

- name: Deploy remux_dvd_concert.sh
  copy:
    src: remux_dvd_concert.sh
    dest: /usr/local/bin/remux_dvd_concert.sh
    mode: '0755'

- name: Deploy compress_concerts.sh
  copy:
    src: compress_concerts.sh
    dest: /usr/local/bin/compress_concerts.sh
    mode: '0755'

- name: Deploy compress-concerts systemd service
  copy:
    src: compress-concerts.service
    dest: /etc/systemd/system/compress-concerts.service

- name: Deploy compress-concerts systemd timer
  copy:
    src: compress-concerts.timer
    dest: /etc/systemd/system/compress-concerts.timer

- name: Enable and start compress-concerts timer
  systemd:
    name: compress-concerts.timer
    enabled: true
    state: started
    daemon_reload: true

- name: Deploy normalize_media.sh
  copy:
    src: normalize_media.sh
    dest: /usr/local/bin/normalize_media.sh
    mode: '0755'

# media-status.welpes.com (Caddy reverse-proxies to this host on :8098) +
# the Homepage widget both read from here. normalize_media.sh calls this
# script itself at the end of every run - no timer needed.
- name: Deploy normalize_media_report.py
  copy:
    src: normalize_media_report.py
    dest: /usr/local/bin/normalize_media_report.py
    mode: '0755'

- name: Ensure normalize-media state dir exists
  file:
    path: /var/lib/normalize-media
    state: directory
    mode: '0755'

- name: Deploy normalize-media-report systemd service
  copy:
    src: normalize-media-report.service
    dest: /etc/systemd/system/normalize-media-report.service

- name: Enable and start normalize-media-report service
  systemd:
    name: normalize-media-report.service
    enabled: true
    state: started
    daemon_reload: true

# Otherwise the page/widget 404s until the first normalize_media.sh run
# generates it - harmless to re-run, produces "No runs recorded yet" if
# history.jsonl doesn't exist.
- name: Generate an initial (possibly empty) report
  command: python3 /usr/local/bin/normalize_media_report.py
  changed_when: false

- name: Deploy normalize-media systemd service
  copy:
    src: normalize-media.service
    dest: /etc/systemd/system/normalize-media.service

- name: Deploy normalize-media systemd timer
  copy:
    src: normalize-media.timer
    dest: /etc/systemd/system/normalize-media.timer
  register: normalize_media_timer

- name: Enable/disable and start/stop normalize-media timer
  systemd:
    name: normalize-media.timer
    enabled: "{{ normalize_media_enabled }}"
    state: "{{ 'started' if normalize_media_enabled else 'stopped' }}"
    daemon_reload: true

# A running timer doesn't recompute its next elapse time just from the unit
# file changing on disk + a daemon-reload - it needs an explicit restart, or
# a schedule change (e.g. moving this to a night-only window) silently keeps
# using the old schedule until the next reboot.
- name: Restart normalize-media timer to pick up schedule changes
  systemd:
    name: normalize-media.timer
    state: restarted
  when: normalize_media_timer.changed and normalize_media_enabled

# On-demand catch-up pass outside the timer's normal 1am-7am window, e.g.
# after the timer sat disabled and a backlog built up. Runs at the lowest
# CPU/IO scheduling priority and in the background (async/poll:0) so it
# doesn't block this playbook or compete with active playback. Opt in with
# `--tags normalize_media_now`. Progress: `journalctl -t normalize-media -f`.
- name: Trigger an on-demand low-priority normalize-media pass (bypasses night window)
  command: nice -n 19 ionice -c3 /usr/local/bin/normalize_media.sh
  environment:
    NIGHT_START_HOUR: "0"
    NIGHT_END_HOUR: "24"
  async: 21600
  poll: 0
  changed_when: true
  tags: [normalize_media_now, never]

- name: Deploy fix_media_permissions.sh
  copy:
    src: fix_media_permissions.sh
    dest: /usr/local/bin/fix_media_permissions.sh
    mode: '0755'

- name: Deploy fix-media-permissions systemd service
  copy:
    src: fix-media-permissions.service
    dest: /etc/systemd/system/fix-media-permissions.service

- name: Deploy fix-media-permissions systemd timer
  copy:
    src: fix-media-permissions.timer
    dest: /etc/systemd/system/fix-media-permissions.timer

- name: Enable and start fix-media-permissions timer
  systemd:
    name: fix-media-permissions.timer
    enabled: true
    state: started
    daemon_reload: true

- name: Run an immediate fix-media-permissions pass
  command: /usr/local/bin/fix_media_permissions.sh
  changed_when: true

# Backfills .lrc synced lyrics for the music library from LRCLIB (free,
# keyless). Exact-match only (see fetch_lyrics.py) - cover songs and live
# recordings that don't match a studio original verbatim are left without a
# .lrc rather than getting the wrong lyrics, so they stay visibly blank for
# a manual tap-to-sync fix. Progress: `journalctl -t fetch-lyrics -f`.
- name: Deploy fetch_lyrics.py
  copy:
    src: fetch_lyrics.py
    dest: /usr/local/bin/fetch_lyrics.py
    mode: '0755'

- name: Deploy fetch-lyrics systemd service
  copy:
    src: fetch-lyrics.service
    dest: /etc/systemd/system/fetch-lyrics.service

- name: Deploy fetch-lyrics systemd timer
  copy:
    src: fetch-lyrics.timer
    dest: /etc/systemd/system/fetch-lyrics.timer

- name: Enable and start fetch-lyrics timer
  systemd:
    name: fetch-lyrics.timer
    enabled: true
    state: started
    daemon_reload: true

# On-demand run so the initial library backfill doesn't wait for the daily
# timer. Low priority/background, same as the normalize-media catch-up task.
- name: Trigger an on-demand fetch-lyrics pass
  command: nice -n 19 ionice -c3 /usr/bin/python3 /usr/local/bin/fetch_lyrics.py
  async: 21600
  poll: 0
  changed_when: true
  tags: [fetch_lyrics_now, never]

# One-off: extract individual songs from the Malón concert MKVs into opus
# files for the Navidrome library, replacing the hand-built rips that were
# tagged outside Ansible. Not part of a normal run — opt in with
# `--tags extract_concert_songs`. See roles/media_tools/files/extract_concert_songs.py
# and the matching navidrome-side deploy tasks in 2_configure_services.yml.
- name: Ensure concert_extracts covers dir exists
  file:
    path: /mnt/ssd2tb/media/concert_extracts/.covers
    state: directory
    mode: '0755'
  tags: [extract_concert_songs, never]

- name: Extract embedded cover art from an existing El Regreso track (source for re-tagging)
  command: >
    ffmpeg -y -i "/data/media/music/Malón/2012 - El regreso más esperado/Malón - El regreso más esperado - 01 - Sintoma de la infección.opus"
    -map 0:v:0 -c copy /tmp/malon_regreso_cover.jpg
  delegate_to: navidrome
  changed_when: true
  tags: [extract_concert_songs, never]

# Unlike El Regreso, this album never had a loose cover.jpg in its library
# folder - only embedded per-track art - so pull it the same way.
- name: Extract embedded cover art from an existing 360 track (source for re-tagging)
  command: >
    ffmpeg -y -i "/data/media/music/Malón/2013 - 360/02 Malón Mestizo.opus"
    -map 0:v:0 -c copy /tmp/malon_360_cover.jpg
  delegate_to: navidrome
  changed_when: true
  tags: [extract_concert_songs, never]

- name: Ensure local relay dir exists
  file:
    path: /tmp/malon_extract_relay
    state: directory
    mode: '0755'
  delegate_to: localhost
  tags: [extract_concert_songs, never]

# rsync refuses a third-party remote-to-remote transfer ("source and
# destination cannot both be remote"), so this hops through a local temp
# dir on the controller instead of copying navidrome -> pve directly.
- name: Pull cover art from navidrome to local relay
  command: >
    rsync -az -e ssh
    "root@{{ hostvars['navidrome'].ansible_host }}:{{ item.src }}"
    "/tmp/malon_extract_relay/{{ item.dest }}"
  delegate_to: localhost
  changed_when: true
  loop:
    - { src: "/tmp/malon_360_cover.jpg", dest: "360.jpg" }
    - { src: "/tmp/malon_regreso_cover.jpg", dest: "regreso.jpg" }
  tags: [extract_concert_songs, never]

- name: Push cover art from local relay to pve
  command: >
    rsync -az -e ssh
    "/tmp/malon_extract_relay/{{ item }}"
    "root@{{ hostvars['pve'].ansible_host }}:/mnt/ssd2tb/media/concert_extracts/.covers/{{ item }}"
  delegate_to: localhost
  changed_when: true
  loop:
    - "360.jpg"
    - "regreso.jpg"
  tags: [extract_concert_songs, never]

- name: Deploy extract_concert_songs.py
  copy:
    src: extract_concert_songs.py
    dest: /usr/local/bin/extract_concert_songs.py
    mode: '0755'
  tags: [extract_concert_songs, never]

- name: Run concert song extraction
  command: python3 /usr/local/bin/extract_concert_songs.py
  register: extract_songs_result
  changed_when: true
  tags: [extract_concert_songs, never]

- name: Show extraction output
  debug:
    var: extract_songs_result.stdout_lines
  tags: [extract_concert_songs, never]
